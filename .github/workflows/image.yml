name: Container
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'cypher/**', 'Dockerfile', 'requirements-runtime.txt', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/canoktayy/cinegraph:latest
            ghcr.io/canoktayy/cinegraph:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/canoktayy/cinegraph
            org.opencontainers.image.description=Evidence-backed movie recommendations
          cache-from: type=gha
          cache-to: type=gha,mode=max
