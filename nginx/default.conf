limit_req_zone $binary_remote_addr zone=llm:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=assistant:10m rate=24r/m;
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 16k;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  # Poster metadata, scripts and styles compress about 6x.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
  location /static/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    # Revalidate on every visit (cheap 304s) so a new release never runs with stale CSS or JS.
    # add_header in a location replaces the server-level headers, so repeat them.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  location = /api/ask {
    limit_req zone=llm burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_read_timeout 70s;
    proxy_set_header Host $host;
  }
  location = /api/assistant/turn {
    limit_req zone=assistant burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_read_timeout 70s;
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://api:8000;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
  }
}
